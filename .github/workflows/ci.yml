# CI for DotMD: renderer tests, Swift package tests, and an app build.
# Branch protection requires only the final "CI passed" job.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Renderer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Skipped until the renderer exists.
      - name: Test the renderer
        if: hashFiles('renderer/package.json') != ''
        working-directory: renderer
        run: |
          npm ci
          npm test

  apple:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # AppIcon.icon needs Xcode 26 or later, so use the newest Xcode on the runner.
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Test DotMDCore
        working-directory: Packages/DotMDCore
        run: swift test
      - name: Test DotMDRender
        working-directory: Packages/DotMDRender
        run: swift test
      - name: Test DotMDBridge
        working-directory: Packages/DotMDBridge
        run: swift test
      - name: Build the app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project DotMD.xcodeproj -scheme DotMD -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  ci-passed:
    name: CI passed
    if: always()
    needs: [ renderer, apple ]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every job passed
        run: test "${{ needs.renderer.result }}" = success && test "${{ needs.apple.result }}" = success
