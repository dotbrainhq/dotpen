name: DotMD
options:
  bundleIdPrefix: app.dotpen
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  DotMDCore:
    path: Packages/DotMDCore
  DotMDRender:
    path: Packages/DotMDRender
  DotMDBridge:
    path: Packages/DotMDBridge
targets:
  DotMD:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: DotMDCore
        product: DotMDCore
      - package: DotMDRender
        product: DotMDRender
      - package: DotMDBridge
        product: DotMDBridge
      - target: DotMDQuickLook
        embed: true
    settings:
      base:
        # Placeholder ID and ad hoc signing until the developer account is ready.
        PRODUCT_BUNDLE_IDENTIFIER: app.dotpen.dotPen
        PRODUCT_NAME: dotPen
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: dotPen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Dotbrain LLC"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/DotMD.entitlements
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  DotMDQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook
    dependencies:
      - package: DotMDRender
        product: DotMDRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dotpen.dotPen.QuickLook
        PRODUCT_NAME: dotPenQuickLook
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: QuickLook/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: dotPen Quick Look
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: QuickLook/QuickLook.entitlements
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
